name: Target Foundry Fork Sanity

on:
  push:
    branches:
      - audit/foundry-53b59f
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POC_TARGET: "0xc7eacdd1e755d2823463abc4434ca445f752b336"
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL != '' && secrets.ETH_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std test dependency
        run: git clone --depth 1 --branch v1.9.7 https://github.com/foundry-rs/forge-std.git foundry/lib/forge-std
      - name: Verify binaries
        run: |
          forge --version
          cast --version
          anvil --version
      - name: Verify Ethereum target and pin block
        shell: bash
        run: |
          set -euo pipefail
          BLOCK=$(cast block-number --rpc-url "$ETH_RPC_URL")
          echo "FORK_BLOCK=$BLOCK" >> "$GITHUB_ENV"
          echo "Fork block: $BLOCK"
          CODE=$(cast code "$POC_TARGET" --block "$BLOCK" --rpc-url "$ETH_RPC_URL")
          test "$CODE" != "0x"
          echo "Target has deployed bytecode (length ${#CODE})"
          echo "ERC165 not assumed for Kailua target"
      - name: Identify target contract interface
        shell: bash
        run: |
          set +e
          cast call "$POC_TARGET" 'owner()(address)' --rpc-url "$ETH_RPC_URL" --block "$FORK_BLOCK"
          cast call "$POC_TARGET" 'KAILUA_TREASURY()(address)' --rpc-url "$ETH_RPC_URL" --block "$FORK_BLOCK"
          cast call "$POC_TARGET" 'version()(string)' --rpc-url "$ETH_RPC_URL" --block "$FORK_BLOCK"
          exit 0
      - name: Run fork sanity test
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" POC_FORK_BLOCK="$FORK_BLOCK" POC_RPC_URL="$ETH_RPC_URL" forge test --match-test test_forkSanity --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv
      - name: Run target-specific authorization tests
        if: false # Previous Manifold-only checks; not suitable for Kailua address
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" POC_FORK_BLOCK="$FORK_BLOCK" POC_RPC_URL="$ETH_RPC_URL" forge test --match-contract TargetAccessForkTest --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv
      - name: Run malformed redemption and callback tests
        if: false # Previous Manifold-only checks
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" POC_FORK_BLOCK="$FORK_BLOCK" POC_RPC_URL="$ETH_RPC_URL" forge test --match-contract TargetRedemptionNegativeForkTest --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv
      - name: Run valid redemption accounting and adversarial token tests
        if: false # Previous Manifold-only checks
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" POC_FORK_BLOCK="$FORK_BLOCK" POC_RPC_URL="$ETH_RPC_URL" forge test --match-contract TargetValidRedemptionForkTest --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv
      - name: Verify supplied Kailua initializer PoC compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" forge test --match-contract KailuaInitializerCompatibilityForkTest --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv
      - name: Run Kailua economic and synthetic-credit payout invariants
        shell: bash
        run: |
          set -euo pipefail
          cd foundry
          POC_TARGET="$POC_TARGET" forge test --match-contract KailuaEconomicForkTest --fork-url "$ETH_RPC_URL" --fork-block-number "$FORK_BLOCK" -vvv

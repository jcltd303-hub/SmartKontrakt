name: Image ML browser
on:
  push:
    branches: ["codex/image-vulnerability-ml"]
  pull_request:
    paths: ["ml/image-vuln/**", "src/lib/image-ml/**", "src/components/image-vulnerability-panel.tsx", "public/models/**", "scripts/image-ml-browser.mjs", ".github/workflows/image-ml.yml"]
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0
      - run: python -m unittest discover -s ml/image-vuln -v
      - run: python ml/image-vuln/verify_export.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Real model in dev and built UI, desktop and mobile
        shell: bash
        run: |
          sudo mkdir -p /workspace/screenshots/image-ml
          sudo chown -R "$USER" /workspace/screenshots
          for mode in dev preview; do
            npm run "$mode" > "/workspace/screenshots/image-ml/$mode-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            port=8080
            if [ "$mode" = preview ]; then port=8081; fi
            for attempt in $(seq 1 120); do
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then break; fi
              kill -0 "$server_pid"
              sleep 1
            done
            node scripts/image-ml-browser.mjs "http://127.0.0.1:$port/" "$mode"
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-ml-browser
          path: /workspace/screenshots/image-ml

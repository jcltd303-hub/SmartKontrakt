name: Image ML browser
on:
  push:
    branches: ["codex/image-vulnerability-ml"]
  pull_request:
    paths:
      [
        "ml/image-vuln/**",
        "src/lib/image-ml/**",
        "src/components/image-vulnerability-panel.tsx",
        "public/models/**",
        "scripts/image-ml-browser.mjs",
        "scripts/resnet-browser-parity.mjs",
        "package.json",
        "package-lock.json",
        ".github/workflows/image-ml.yml",
      ]
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 onnx==1.23.2 onnxruntime==1.31.0
      - run: python -m unittest discover -s ml/image-vuln -v
      - run: python ml/image-vuln/verify_export.py
      - run: python ml/image-vuln/verify_resnet_browser.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start dev and built servers
        shell: bash
        run: |
          sudo mkdir -p /workspace/screenshots/image-ml
          sudo chown -R "$USER" /workspace/screenshots
          npm run dev > /workspace/screenshots/image-ml/dev-server.log 2>&1 &
          npm run preview > /workspace/screenshots/image-ml/preview-server.log 2>&1 &
          for port in 8080 8081; do
            ready=false
            for attempt in $(seq 1 120); do
              if curl --fail --silent "http://127.0.0.1:$port/" > /dev/null; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then cat /workspace/screenshots/image-ml/*-server.log; exit 1; fi
          done
      - name: Verify dev RGB inference
        run: node scripts/image-ml-browser.mjs http://127.0.0.1:8080/ dev
      - name: Verify dev ResNet parity, cancellation and preview prefix
        run: node scripts/resnet-browser-parity.mjs http://127.0.0.1:8080/ dev
      - name: Verify built RGB inference
        run: node scripts/image-ml-browser.mjs http://127.0.0.1:8081/ preview
      - name: Verify built ResNet parity, cancellation and preview prefix
        run: node scripts/resnet-browser-parity.mjs http://127.0.0.1:8081/ preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-ml-browser
          path: /workspace/screenshots/image-ml

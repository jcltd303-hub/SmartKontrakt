name: ResNet1D training
on:
  workflow_dispatch:
    inputs:
      train_cap:
        description: Training cap after held-out input collision filtering
        default: "8192"
        required: true
      epochs:
        description: Total epochs including completed resume epochs; increase for continuation
        default: "2"
        required: true
      resume_run:
        description: Optional previous training run ID containing last.pt
        default: ""
        required: false
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 scikit-learn==1.8.0 pyarrow==26.0.0 requests==2.34.2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/smartkontrakt-image-data
          key: slither-columns-${{ hashFiles('ml/image-vuln/dataset-manifest.json') }}
      - run: python -m unittest discover -s ml/image-vuln -v
      - name: Acquire actual dataset columns
        run: python ml/image-vuln/acquire.py --manifest ml/image-vuln/dataset-manifest.json --cache "$HOME/.cache/smartkontrakt-image-data"
      - uses: actions/download-artifact@v4
        if: inputs.resume_run != ''
        with:
          name: resnet1d-training
          path: resnet-output
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Train or resume actual candidate
        shell: bash
        env:
          TRAIN_CAP: ${{ inputs.train_cap }}
          TOTAL_EPOCHS: ${{ inputs.epochs }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          resume_args=()
          if [ -n "$RESUME_RUN" ]; then resume_args=(--resume resnet-output/last.pt); fi
          python ml/image-vuln/train_resnet1d.py --cache "$HOME/.cache/smartkontrakt-image-data" --output resnet-output --train-cap "$TRAIN_CAP" --epochs "$TOTAL_EPOCHS" --threads 2 "${resume_args[@]}"
          python ml/image-vuln/verify_resnet1d.py --directory resnet-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resnet1d-training
          path: resnet-output
          retention-days: 90

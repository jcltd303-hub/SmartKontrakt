name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The app targets Node 22.16+ (see package.json engines in the README).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No lockfile is committed yet, so `npm ci` cannot run. `npm install`
      # resolves package.json directly. Commit a package-lock.json (npm install
      # once, locally) and switch this to `npm ci` for reproducible builds.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the detector self-check (also run by `npm test`).
      - name: Test
        run: npm test

      # Lint gates the build. The pre-existing backlog is cleared, and the
      # script runs with --max-warnings 0, so a new warning fails here rather
      # than accumulating unnoticed.
      - name: Lint
        run: npm run lint

      # Detection quality gates (2026-10-27). The benchmark scores the rules
      # against SmartBugs Curated and fails on a regression against
      # scripts/smartbugs-baseline.json; the binding check renames each
      # detector's emission in a copy of the source and asserts a fixture
      # notices, so a rule cannot ship with no test that depends on it.
      - name: Detection benchmark (SmartBugs Curated)
        run: npm run benchmark:smartbugs

      - name: Detector binding check
        run: npm run check:binding

      # The 2026-era corpus: SmartBugs Curated is 2018-era and cannot fire the
      # classes added for the 2026 incidents, so those rules are measured here.
      # Fails on any recall loss or unexplained cross-talk.
      - name: Incident corpus (2026-era classes)
        run: npm run benchmark:incidents

  # The only place the PoC templates and the fixture corpus are actually
  # COMPILED. The unit suite is structural, so a template that cannot compile
  # passes it — `19-signature-malleability` shipped with invalid `0x123...`
  # literals and nothing noticed. These two checks are what would have caught it.
  fallbacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Downloads forge/cast/anvil and lets forge fetch solc itself.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Foundry version
        run: forge --version

      # No `npm install`: both scripts use only Node built-ins.
      # The count is deliberately not in the step name — it went stale at "46"
      # while the directory grew to 59, and a step title is not a measurement.
      - name: Compile every fallback harness
        run: npm run check:fallbacks

      - name: Run the fixture corpus (29 ports, differential)
        run: npm run check:fixtures

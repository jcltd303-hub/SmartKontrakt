name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# The app targets Node 22.16+ (see package.json engines in the README).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No lockfile is committed yet, so `npm ci` cannot run. `npm install`
      # resolves package.json directly. Commit a package-lock.json (npm install
      # once, locally) and switch this to `npm ci` for reproducible builds.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Unit tests plus the detector self-check (also run by `npm test`).
      - name: Test
        run: npm test

      # Lint runs last and does NOT gate the build yet: the repository has a
      # pre-existing backlog of warnings (unused vars, hook dependency arrays,
      # fast-refresh exports) that is a separate cleanup. Remove
      # `continue-on-error` once that backlog is cleared and lint should block.
      - name: Lint
        continue-on-error: true
        run: npm run lint

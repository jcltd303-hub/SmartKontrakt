name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare guarded screenshot directory
        run: sudo install -d -o "$(id -un)" -g "$(id -gn)" /workspace/screenshots/ci
      - name: Verify desktop and mobile in dev and built output
        run: bash scripts/ci-browser-smoke.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: /workspace/screenshots/ci/
          if-no-files-found: ignore
          retention-days: 7
